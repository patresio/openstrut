name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find src bin -name "*.js" -exec node --check {} \;
          # .opencode/plugins has no package.json type; node --check on
          # ESM-detected files misses await-in-non-async (Node >= 22.7 bug),
          # so force ESM parsing via stdin.
          find .opencode/plugins -name "*.js" -exec sh -c 'node --input-type=module --check < "$1"' _ {} \;
      - name: Check Python syntax (Hermes plugin)
        run: |
          python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('plugins/opentrust').glob('*.py')]"
      - name: Check for common issues
        run: |
          grep -r "console.log" src/ --include="*.js" && echo "Warning: console.log found in src" || true
          grep -r "TODO\|FIXME\|HACK" src/ --include="*.js" && echo "Warning: TODO/FIXME/HACK found" || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - run: node evals/runner/run.js --layer deterministic
