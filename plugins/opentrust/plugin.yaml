name: opentrust
version: 1.0.0
description: OpenTrust multi-platform agent harness
author: OpenTrust Team
license: UNLICENSED

hooks:
  - name: on_session_start
    command: python hooks.py
    description: Inject OpenTrust context at session start
  - name: on_session_end
    command: python hooks.py
    description: Cleanup OpenTrust context at session end

tools:
  - name: ot_explore
    command: python tools.py
    description: Synthesize OpenTrust context for exploration
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_propose
    command: python tools.py
    description: OpenTrust Propose phase guidance
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_apply
    command: python tools.py
    description: OpenTrust Apply phase guidance
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_review
    command: python tools.py
    description: OpenTrust Review phase guidance
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_ship
    command: python tools.py
    description: OpenTrust Ship phase guidance
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_status
    command: python tools.py
    description: OpenTrust status check
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_incident
    command: python tools.py
    description: OpenTrust incident response
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_synthetize
    command: python tools.py
    description: OpenTrust synthetize mode
    parameters:
      - name: session
        type: object
        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true
  - name: ot_create
    command: python tools.py
    description: OpenTrust create mode
    parameters:
      - name: session
