    description: Retrieve context from Operational Retrieval Map
  - name: opentrust_workflow_orchestrator
    file: skills/opentrust_workflow_orchestrator.md
    description: Orchestrate OpenTrust workflow
  - name: opentrust_quality_gate
    file: skills/opentrust_quality_gate.md
    description: Enforce quality gates in OpenTrust
  - name: opentrust_security_review
    file: skills/opentrust_security_review.md
    description: Review security in OpenTrust
