        required: true
      - name: task
        type: object
        required: true
      - name: project
        type: object
        required: true

skills:
  - name: opentrust_task_contract
    file: skills/opentrust_task_contract.md
    description: Create task contracts with retrieval context
  - name: opentrust_reference_research
    file: skills/opentrust_reference_research.md
    description: Use Operational Retrieval Map selectors
  - name: opentrust_delivery
    file: skills/opentrust_delivery.md
    description: Prepare commit, push, and pull request
  - name: opentrust_observability
    file: skills/opentrust_observability.md
    description: Require execution reports and validation evidence
  - name: opentrust_spec_change
    file: skills/opentrust_spec_change.md
    description: Guide structured spec and design changes
  - name: opentrust_meeting_facilitator
    file: skills/opentrust_meeting_facilitator.md
